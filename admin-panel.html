<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - As Formiguinhas</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Cabeçalho -->
    <header class="header">
        <nav class="nav">
            <div class="nav-marca">
                <h2>As Formiguinhas</h2>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Voltar ao Site</a></li>
                <li><a href="#" class="nav-link nav-login"></a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="admin-section">
            <div class="container">
                <h1 class="admin-title">Painel Administrativo</h1>
                
                <div class="admin-grid">
                    <!-- Eventos -->
                    <div class="admin-card">
                        <div class="admin-card-header">
                            <i class="fas fa-calendar"></i>
                            <h2>Gerenciar Eventos</h2>
                        </div>
                        <div class="admin-card-content">
                            <button class="btn btn-second">Adicionar Evento</button>
                            <button class="btn btn-second">Listar Eventos</button>
                        </div>
                    </div>

                    <!-- Doações -->
                    <div class="admin-card">
                        <div class="admin-card-header">
                            <i class="fas fa-hand-holding-heart"></i>
                            <h2>Controle de Doações</h2>
                        </div>
                        <div class="admin-card-content">
                            <button class="btn btn-second">Registrar Doação</button>
                            <button class="btn btn-second">Relatório de Doações</button>
                        </div>
                    </div>

                    <!-- Voluntários -->
                    <div class="admin-card">
                        <div class="admin-card-header">
                            <i class="fas fa-users"></i>
                            <h2>Voluntários</h2>
                        </div>
                        <div class="admin-card-content">
                            <button class="btn btn-second">Cadastrar Voluntário</button>
                            <button class="btn btn-second">Lista de Voluntários</button>
                        </div>
                    </div>

                    <!-- Configurações -->
                    <div class="admin-card">
                        <div class="admin-card-header">
                            <i class="fas fa-cog"></i>
                            <h2>Configurações</h2>
                        </div>
                        <div class="admin-card-content">
                            <button class="btn btn-second">Configurações do Site</button>
                            <button class="btn btn-second">Gerenciar Usuários</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p>&copy; 2025 As Formiguinhas. Todos os direitos reservados.</p>
            </div>
        </div>
    </footer>

    <script src="index.js"></script>
</body>
</html>
