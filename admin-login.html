<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrativo - As Formiguinhas</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Cabeçalho -->
    <header class="header">
        <nav class="nav">
            <div class="nav-marca">
                <h2>As Formiguinhas</h2>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Voltar ao Site</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="login-section">
            <div class="container">
                <div class="login-box">
                    <h2>Área Administrativa</h2>
                    <form id="loginForm" class="login-form">
                        <div class="form-group">
                            <label for="username">
                                <i class="fas fa-user"></i> Usuário
                            </label>
                            <input type="text" id="username" name="username" required>
                        </div>
                        <div class="form-group">
                            <label for="password">
                                <i class="fas fa-lock"></i> Senha
                            </label>
                            <input type="password" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-first">Entrar</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p>&copy; 2025 As Formiguinhas. Todos os direitos reservados.</p>
            </div>
        </div>
    </footer>

    <script src="index.js"></script>
</body>
</html>
